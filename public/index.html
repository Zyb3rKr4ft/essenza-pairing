<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essenza Session Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans flex items-center justify-center min-h-screen p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl max-w-md w-full shadow-2xl">
        <h1 class="text-2xl font-bold mb-2 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Essenza Pairing</h1>
        <p class="text-zinc-400 text-sm text-center mb-6">Enter your WhatsApp number to generate a session ID.</p>

        <!-- STEP 1: Input Number -->
        <div id="step1">
            <input type="text" id="phone" class="w-full bg-zinc-950 border border-zinc-700 p-3 rounded-lg mb-4 focus:outline-none focus:border-blue-500" placeholder="e.g. 2348012345678">
            <button onclick="generateCode()" id="btn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition">Get Pairing Code</button>
        </div>

        <!-- STEP 2: Show Code -->
        <div id="step2" class="hidden text-center">
            <p class="text-zinc-400 mb-2">Enter this code on your WhatsApp:</p>
            <div id="codeDisplay" class="text-3xl font-mono font-bold tracking-widest text-blue-400 mb-6">----</div>
            <p class="text-yellow-500 text-sm animate-pulse">Waiting for you to enter the code...</p>
        </div>

        <!-- STEP 3: Show Session ID -->
        <div id="step3" class="hidden">
            <p class="text-green-500 text-center font-bold mb-2">✅ Success! Here is your Session ID:</p>
            <textarea id="sessionBox" class="w-full bg-zinc-950 border border-zinc-700 p-3 rounded-lg mb-4 text-xs font-mono h-32" readonly></textarea>
            <button onclick="copySession()" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-lg font-bold transition">Copy Session ID</button>
            <p class="text-zinc-500 text-xs text-center mt-4">Paste this into the <b>SESSION_ID</b> environment variable on your hosting panel.</p>
        </div>
    </div>

    <script>
        let currentPhone = '';

        async function generateCode() {
            currentPhone = document.getElementById('phone').value.trim();
            if (!currentPhone) return alert('Enter a number');
            
            const btn = document.getElementById('btn');
            btn.innerText = 'Generating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: currentPhone })
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                    document.getElementById('codeDisplay').innerText = data.code;
                    checkStatus();
                } else {
                    alert(data.error);
                    btn.innerText = 'Get Pairing Code';
                    btn.disabled = false;
                }
            } catch (e) {
                alert('Error connecting to server');
                btn.innerText = 'Get Pairing Code';
                btn.disabled = false;
            }
        }

        async function checkStatus() {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch('/api/status/' + currentPhone);
                    const data = await res.json();
                    
                    if (data.status === 'success' && data.sessionId) {
                        clearInterval(interval);
                        document.getElementById('step2').classList.add('hidden');
                        document.getElementById('step3').classList.remove('hidden');
                        document.getElementById('sessionBox').value = data.sessionId;
                    }
                } catch (e) {}
            }, 3000);
        }

        function copySession() {
            const box = document.getElementById('sessionBox');
            box.select();
            document.execCommand('copy');
            alert('Session ID Copied!');
        }
    </script>
</body>
</html>
